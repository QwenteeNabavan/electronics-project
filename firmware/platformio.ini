; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

; ==============================================================================
; Загальні налаштування для всіх конфігурацій
; ==============================================================================
[env]
framework = arduino
monitor_speed = 115200
build_flags = 
    -I include
    -Wall
    -D CORE_DEBUG_LEVEL=3

; ==============================================================================
; Цільова платформа 1: Espressif ESP32
; ==============================================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
upload_speed = 921600

; ==============================================================================
; Цільова платформа 2: Raspberry Pi Pico (RP2040) (якщо потрібно)
; ==============================================================================
[env:pico]
platform = raspberrypi
board = pico

; ==============================================================================
; Цільова платформа 3: STM32 BluePill (STM32F103C8) (якщо потрібно)
; ==============================================================================
[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
upload_protocol = stlink
